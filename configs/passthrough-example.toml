# v10 passthrough resource example.
# This file is illustrative; use configs/qemu-aarch64.toml.in for the
# executable QEMU acceptance configuration.

[[domain.passthrough]]
path = "/abba/i2c0"
force_assign_without_iommu = false
strip_external_dependencies = false
mmio = { host = "0x12340000", guest = "same", size = "4K" }
irq = { type = "spi", number = 42, flags = 4 }
